<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>원무팀 지옥도 - 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --outline:#160606; --panel:#241412; --panel-text:#f3ddc4;
    --ember:#ff7a2e; --ember-dim:#c1541c; --ash:#160d0b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    font-family:'Noto Sans KR', sans-serif; color:var(--panel-text);
    background:radial-gradient(ellipse at 50% 0%, #4a1108 0%, #1c0805 55%, #070302 100%);
  }
  .wrap{ max-width:720px; margin:0 auto; padding:40px 20px 70px; }
  h1{ font-weight:900; font-size:1.4rem; text-align:center; color:var(--ember); margin-bottom:22px; }

  /* PIN gate */
  #gate{ text-align:center; margin-top:60px; }
  #dots{ display:flex; justify-content:center; gap:14px; margin:24px 0; }
  #dots span{
    width:16px; height:16px; border-radius:50%;
    border:2px solid var(--ember-dim); background:transparent;
  }
  #dots span.filled{ background:var(--ember); }
  #gate p{ opacity:.75; font-size:0.85rem; }
  #gateError{ color:#ff8a6a; font-size:0.82rem; min-height:1.4em; }

  /* main admin ui */
  #admin{ display:none; }
  .tabs{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:22px; }
  .tab{
    padding:8px 14px; border:2px solid var(--ember-dim); background:var(--panel);
    color:var(--panel-text); font-weight:700; font-size:0.82rem; cursor:pointer; border-radius:8px;
  }
  .tab.active{ background:var(--ember); color:#1c0805; border-color:var(--ember); }

  .card{
    background:var(--panel); border:2px solid var(--outline); border-radius:10px;
    padding:16px; margin-bottom:18px;
  }
  .count{ font-weight:900; color:var(--ember); margin-bottom:12px; }
  .row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 0; border-bottom:1px solid rgba(255,255,255,.08);
  }
  .row:last-child{ border-bottom:none; }
  .row .info{ font-size:0.85rem; }
  .row .info .n{ font-weight:700; }
  .row .info .u{ display:block; font-size:0.72rem; opacity:.6; word-break:break-all; }
  .del{
    background:#6b2110; color:#fff; border:none; border-radius:6px;
    padding:6px 10px; font-size:0.75rem; cursor:pointer; flex-shrink:0;
  }

  label{ display:block; font-size:0.8rem; font-weight:700; margin:10px 0 4px; }
  input[type=text], textarea{
    width:100%; padding:9px 10px; border:2px solid var(--ember-dim);
    background:var(--ash); color:var(--panel-text); border-radius:6px; font-family:inherit; font-size:0.85rem;
  }
  .seg{ display:flex; gap:8px; margin-top:6px; }
  .seg label{ display:flex; align-items:center; gap:6px; font-weight:400; margin:0; font-size:0.8rem; }
  #addBtn{
    margin-top:14px; width:100%; padding:11px; border:none; border-radius:8px;
    background:var(--ember); color:#1c0805; font-weight:900; font-size:0.9rem; cursor:pointer;
  }
  #addBtn:disabled{ opacity:.4; cursor:not-allowed; }
  #formMsg{ font-size:0.8rem; margin-top:8px; min-height:1.2em; }
  #formMsg.ok{ color:#8fd68a; }
  #formMsg.err{ color:#ff8a6a; }

  a.back{ display:block; text-align:center; margin-top:20px; color:#c9a98f; font-size:0.78rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔥 원무팀 지옥도 · 관리자</h1>

  <div id="gate">
    <p>4자리 PIN을 입력하세요 (키보드로 바로 입력)</p>
    <div id="dots"><span></span><span></span><span></span><span></span></div>
    <div id="gateError"></div>
  </div>

  <div id="admin">
    <div class="tabs" id="tabs"></div>
    <div class="card">
      <div class="count" id="count"></div>
      <div id="list"></div>
    </div>

    <div class="card">
      <strong>새 캐릭터 추가</strong>
      <label>이름</label>
      <input type="text" id="fName" placeholder="예: 처방 조회 도구">
      <label>아이콘 (이모지 1개)</label>
      <input type="text" id="fEmoji" placeholder="🔥" maxlength="4">
      <label>설명</label>
      <input type="text" id="fDesc" placeholder="이 도구가 뭐 하는 건지 한 줄">

      <label>등록 방식</label>
      <div class="seg">
        <label><input type="radio" name="mode" value="url" checked> 링크(URL)</label>
        <label><input type="radio" name="mode" value="file"> HTML 파일 업로드</label>
      </div>

      <div id="urlField">
        <label>주소</label>
        <input type="text" id="fUrl" placeholder="https://...">
      </div>
      <div id="fileField" style="display:none;">
        <label>HTML 파일 선택</label>
        <input type="file" id="fFile" accept=".html,.htm">
      </div>

      <button id="addBtn">추가하기</button>
      <div id="formMsg"></div>
    </div>

    <a class="back" href="index.html">← 지도로 돌아가기</a>
  </div>
</div>

<script>
/* index.html 과 반드시 동일한 값으로 맞춰주세요 */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwCtH6IPuuBwaYtDCvzby4fCdUwN4xwhcg282JTL3U6tvauvBJmEg0boxmlHyQ-rd3yGA/exec";
const VILLAGE_LIMIT = 8;

const VILLAGES = [
  { id: "wonmu", name: "발설지옥 · 원무" },
  { id: "billing", name: "도산지옥 · 청구" },
  { id: "stats", name: "거해지옥 · 통계" },
  { id: "finance", name: "화탕지옥 · 자산" }
];

let pin = "";
let currentVillage = VILLAGES[0].id;
let allTools = [];
let verifiedPin = "";

const dots = document.querySelectorAll("#dots span");
function updateDots(){
  dots.forEach((d,i) => d.classList.toggle("filled", i < pin.length));
}

document.addEventListener("keydown", e => {
  if (document.getElementById("admin").style.display === "block") return;
  if (/^[0-9]$/.test(e.key) && pin.length < 4) {
    pin += e.key;
    updateDots();
    if (pin.length === 4) checkPin();
  } else if (e.key === "Backspace") {
    pin = pin.slice(0, -1);
    updateDots();
  }
});

async function checkPin(){
  // 서버에 실제 쓰기 요청을 보낼 때 이 PIN이 함께 검증되므로,
  // 여기서는 화면 전환만 가볍게 처리하고 실제 인증은 매 요청마다 서버에서 확인합니다.
  verifiedPin = pin;
  document.getElementById("gate").style.display = "none";
  document.getElementById("admin").style.display = "block";
  buildTabs();
  await loadTools();
}

function buildTabs(){
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  VILLAGES.forEach(v => {
    const b = document.createElement("button");
    b.className = "tab" + (v.id === currentVillage ? " active" : "");
    b.textContent = v.name;
    b.onclick = () => { currentVillage = v.id; buildTabs(); renderList(); };
    tabs.appendChild(b);
  });
}

async function loadTools(){
  try {
    const res = await fetch(SCRIPT_URL + "?action=getData");
    const data = await res.json();
    allTools = (data.ok && data.tools) ? data.tools : [];
  } catch(err){
    allTools = [];
  }
  renderList();
}

function renderList(){
  const list = document.getElementById("list");
  const items = allTools.filter(t => t.village === currentVillage);
  document.getElementById("count").textContent = `현재 ${items.length} / ${VILLAGE_LIMIT}명`;
  document.getElementById("addBtn").disabled = items.length >= VILLAGE_LIMIT;

  list.innerHTML = "";
  if (items.length === 0){
    list.innerHTML = '<div style="opacity:.6; font-size:0.82rem;">아직 아무도 없어요.</div>';
    return;
  }
  items.forEach(t => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div class="info">
        <span class="n">${t.emoji || "🔥"} ${t.name}</span>
        <span class="u">${t.url || "(링크 없음)"}</span>
      </div>
      <button class="del">삭제</button>
    `;
    row.querySelector(".del").onclick = () => deleteTool(t.id, t.name);
    list.appendChild(row);
  });
}

async function deleteTool(id, name){
  if (!confirm(`"${name}" 을(를) 삭제할까요?`)) return;
  const res = await fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({ action: "deleteTool", pin: verifiedPin, id })
  });
  const data = await res.json();
  if (data.ok) {
    await loadTools();
  } else {
    alert(data.error || "삭제 실패");
  }
}

/* 등록 방식 토글 */
document.querySelectorAll('input[name="mode"]').forEach(r => {
  r.addEventListener("change", () => {
    const isFile = document.querySelector('input[name="mode"]:checked').value === "file";
    document.getElementById("urlField").style.display = isFile ? "none" : "block";
    document.getElementById("fileField").style.display = isFile ? "block" : "none";
  });
});

document.getElementById("addBtn").addEventListener("click", async () => {
  const name = document.getElementById("fName").value.trim();
  const emoji = document.getElementById("fEmoji").value.trim() || "🔥";
  const desc = document.getElementById("fDesc").value.trim();
  const mode = document.querySelector('input[name="mode"]:checked').value;
  const msg = document.getElementById("formMsg");
  msg.textContent = ""; msg.className = "";

  if (!name){ msg.textContent = "이름을 입력해주세요."; msg.className = "err"; return; }

  const payload = { action: "addTool", pin: verifiedPin, village: currentVillage, name, emoji, desc };

  if (mode === "url") {
    const url = document.getElementById("fUrl").value.trim();
    if (!url){ msg.textContent = "링크를 입력해주세요."; msg.className = "err"; return; }
    payload.url = url;
    await submitTool(payload, msg);
  } else {
    const fileInput = document.getElementById("fFile");
    const file = fileInput.files[0];
    if (!file){ msg.textContent = "HTML 파일을 선택해주세요."; msg.className = "err"; return; }
    const reader = new FileReader();
    reader.onload = async () => {
      payload.fileContent = reader.result;
      await submitTool(payload, msg);
    };
    reader.readAsText(file, "utf-8");
  }
});

async function submitTool(payload, msg){
  document.getElementById("addBtn").disabled = true;
  try {
    const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
    const data = await res.json();
    if (data.ok) {
      msg.textContent = "추가됐어요!";
      msg.className = "ok";
      document.getElementById("fName").value = "";
      document.getElementById("fEmoji").value = "";
      document.getElementById("fDesc").value = "";
      document.getElementById("fUrl").value = "";
      document.getElementById("fFile").value = "";
      await loadTools();
    } else {
      msg.textContent = data.error || "추가 실패";
      msg.className = "err";
    }
  } catch(err){
    msg.textContent = "네트워크 오류: " + err;
    msg.className = "err";
  }
  renderList();
}
</script>
</body>
</html>
