<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>원무팀 지옥도 - 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --outline:#160606; --panel:#241412; --panel-text:#f3ddc4;
    --ember:#ff7a2e; --ember-dim:#c1541c; --ash:#160d0b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    font-family:'Noto Sans KR', sans-serif; color:var(--panel-text);
    background:radial-gradient(ellipse at 50% 0%, #4a1108 0%, #1c0805 55%, #070302 100%);
  }
  .wrap{ max-width:720px; margin:0 auto; padding:40px 20px 70px; }
  h1{ font-weight:900; font-size:1.4rem; text-align:center; color:var(--ember); margin-bottom:22px; }

  /* PIN gate */
  #gate{ text-align:center; margin-top:60px; }
  #dots{ display:flex; justify-content:center; gap:14px; margin:24px 0; }
  #dots span{
    width:16px; height:16px; border-radius:50%;
    border:2px solid var(--ember-dim); background:transparent;
  }
  #dots span.filled{ background:var(--ember); }
  #gate p{ opacity:.75; font-size:0.85rem; }
  #gateError{ color:#ff8a6a; font-size:0.82rem; min-height:1.4em; }

  /* main admin ui */
  #admin{ display:none; }
  .tabs{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:22px; }
  .tab{
    padding:8px 14px; border:2px solid var(--ember-dim); background:var(--panel);
    color:var(--panel-text); font-weight:700; font-size:0.82rem; cursor:pointer; border-radius:8px;
  }
  .tab.active{ background:var(--ember); color:#1c0805; border-color:var(--ember); }

  .card{
    background:var(--panel); border:2px solid var(--outline); border-radius:10px;
    padding:16px; margin-bottom:18px;
  }
  .count{ font-weight:900; color:var(--ember); margin-bottom:12px; }
  .row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 0; border-bottom:1px solid rgba(255,255,255,.08);
  }
  .row:last-child{ border-bottom:none; }
  .row .info{ font-size:0.85rem; }
  .row .info .n{ font-weight:700; }
  .row .info .u{ display:block; font-size:0.72rem; opacity:.6; word-break:break-all; }
  .actions{ display:flex; gap:6px; flex-shrink:0; }
  .edit, .del{
    color:#fff; border:none; border-radius:6px;
    padding:6px 10px; font-size:0.75rem; cursor:pointer;
  }
  .edit{ background:#6a5525; }
  .del{ background:#6b2110; }

  label{ display:block; font-size:0.8rem; font-weight:700; margin:10px 0 4px; }
  input[type=text], textarea{
    width:100%; padding:9px 10px; border:2px solid var(--ember-dim);
    background:var(--ash); color:var(--panel-text); border-radius:6px; font-family:inherit; font-size:0.85rem;
  }
  .seg{ display:flex; gap:8px; margin-top:6px; }
  .seg label{ display:flex; align-items:center; gap:6px; font-weight:400; margin:0; font-size:0.8rem; }
  #addBtn{
    margin-top:14px; width:100%; padding:11px; border:none; border-radius:8px;
    background:var(--ember); color:#1c0805; font-weight:900; font-size:0.9rem; cursor:pointer;
  }
  #addBtn:disabled{ opacity:.4; cursor:not-allowed; }
  #cancelEditBtn{
    display:none; margin-top:8px; width:100%; padding:9px; border:1px solid var(--ember-dim);
    border-radius:8px; background:transparent; color:var(--panel-text); font-weight:700; cursor:pointer;
  }
  #formMsg{ font-size:0.8rem; margin-top:8px; min-height:1.2em; }
  #formMsg.ok{ color:#8fd68a; }
  #formMsg.err{ color:#ff8a6a; }

  a.back{ display:block; text-align:center; margin-top:20px; color:#c9a98f; font-size:0.78rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔥 원무팀 지옥도 · 관리자</h1>

  <div id="gate">
    <p>4자리 PIN을 입력하세요 (키보드로 바로 입력)</p>
    <div id="dots"><span></span><span></span><span></span><span></span></div>
    <div id="gateError"></div>
  </div>

  <div id="admin">
    <div class="tabs" id="tabs"></div>
    <div class="card">
      <div class="count" id="count"></div>
      <div id="list"></div>
    </div>

    <div class="card" id="toolFormCard">
      <strong id="formTitle">새 캐릭터 추가</strong>
      <label>이름</label>
      <input type="text" id="fName" placeholder="예: 처방 조회 도구">
      <label>아이콘 (이모지 1개)</label>
      <input type="text" id="fEmoji" placeholder="🔥" maxlength="4">
      <label>설명</label>
      <input type="text" id="fDesc" placeholder="이 도구가 뭐 하는 건지 한 줄">

      <label>등록 방식</label>
      <div class="seg">
        <label><input type="radio" name="mode" value="url" checked> 링크(URL)</label>
        <label><input type="radio" name="mode" value="file"> HTML 파일 업로드</label>
      </div>

      <div id="urlField">
        <label>주소</label>
        <input type="text" id="fUrl" placeholder="https://...">
      </div>
      <div id="fileField" style="display:none;">
        <label id="fileLabel">HTML 파일 선택</label>
        <input type="file" id="fFile" accept=".html,.htm">
        <div id="fileHelp" style="font-size:0.72rem; opacity:.65; margin-top:5px;"></div>
      </div>

      <button id="addBtn">추가하기</button>
      <button id="cancelEditBtn" type="button">수정 취소</button>
      <div id="formMsg"></div>
    </div>

    <a class="back" href="index.html">← 지도로 돌아가기</a>

    <div class="card" style="margin-top:18px;">
      <strong>관리자 PIN 변경</strong>
      <label>새 PIN (숫자 4자리)</label>
      <input type="text" id="pinNew" inputmode="numeric" maxlength="4" placeholder="예: 1234">
      <label>새 PIN 확인</label>
      <input type="text" id="pinConfirm" inputmode="numeric" maxlength="4" placeholder="다시 입력">
      <button id="pinBtn" style="margin-top:12px; width:100%; padding:10px; border:none; border-radius:8px; background:var(--ember-dim); color:#fff; font-weight:900; font-size:0.85rem; cursor:pointer;">PIN 변경하기</button>
      <div id="pinMsg" style="font-size:0.8rem; margin-top:8px; min-height:1.2em;"></div>
    </div>
  </div>
</div>

<script>
/* index.html 과 반드시 동일한 값으로 맞춰주세요 */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwCtH6IPuuBwaYtDCvzby4fCdUwN4xwhcg282JTL3U6tvauvBJmEg0boxmlHyQ-rd3yGA/exec";
const VILLAGE_LIMIT = 8;
const CLIENT_ID_KEY = "gotohell-admin-client-id";
const MAIN_CACHE_KEY = "gotohell-tools-v2";
const clientId = (() => {
  try {
    let id = localStorage.getItem(CLIENT_ID_KEY);
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`);
      localStorage.setItem(CLIENT_ID_KEY, id);
    }
    return id;
  } catch (_) {
    return "browser";
  }
})();

function saveMainCache(tools){
  try {
    if (!Array.isArray(tools)) return;
    localStorage.setItem(MAIN_CACHE_KEY, JSON.stringify({ tools, savedAt: Date.now() }));
  } catch (_) {}
}

function isValidHttpUrl(value){
  try {
    const u = new URL(String(value || "").trim());
    return u.protocol === "https:" || u.protocol === "http:";
  } catch (_) { return false; }
}

async function fetchJSON(url, options, retries = 1){
  for (let attempt = 0; attempt <= retries; attempt++){
    try {
      const res = await fetch(url, options);
      const text = await res.text();
      return JSON.parse(text);
    } catch(err){
      if (attempt === retries) throw err;
      await new Promise(r => setTimeout(r, 700));
    }
  }
}

const VILLAGES = [
  { id: "wonmu", name: "발설지옥 · 원무" },
  { id: "billing", name: "도산지옥 · 청구" },
  { id: "stats", name: "거해지옥 · 통계" },
  { id: "finance", name: "화탕지옥 · 자산" }
];

let pin = "";
let currentVillage = VILLAGES[0].id;
let allTools = [];
let verifiedPin = "";
let editingToolId = null;

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[ch]));
}

const dots = document.querySelectorAll("#dots span");
function updateDots(){
  dots.forEach((d,i) => d.classList.toggle("filled", i < pin.length));
}

document.addEventListener("keydown", e => {
  if (document.getElementById("admin").style.display === "block") return;
  if (checking) return;
  if (/^[0-9]$/.test(e.key) && pin.length < 4) {
    pin += e.key;
    updateDots();
    if (pin.length === 4) checkPin();
  } else if (e.key === "Backspace") {
    pin = pin.slice(0, -1);
    updateDots();
  }
});

let checking = false;

async function checkPin(){
  checking = true;
  document.getElementById("gateError").textContent = "확인 중...";
  try {
    const data = await fetchJSON(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: "verifyPin", pin, clientId })
    }, 1);
    if (data.ok) {
      verifiedPin = pin;
      allTools = data.tools || [];
      document.getElementById("gateError").textContent = "";
      document.getElementById("gate").style.display = "none";
      document.getElementById("admin").style.display = "block";
      buildTabs();
      renderList();
    } else {
      document.getElementById("gateError").textContent = data.error || "PIN이 올바르지 않습니다.";
      pin = "";
      updateDots();
    }
  } catch(err) {
    document.getElementById("gateError").textContent = "오류: " + (err && err.message ? err.message : err);
    pin = "";
    updateDots();
  }
  checking = false;
}

function buildTabs(){
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  VILLAGES.forEach(v => {
    const b = document.createElement("button");
    b.className = "tab" + (v.id === currentVillage ? " active" : "");
    b.textContent = v.name;
    b.onclick = () => { currentVillage = v.id; buildTabs(); renderList(); };
    tabs.appendChild(b);
  });
}

async function loadTools(){
  try {
    const data = await fetchJSON(SCRIPT_URL + "?action=getData&_=" + Date.now(), undefined, 1);
    allTools = (data.ok && Array.isArray(data.tools)) ? data.tools : [];
    if (allTools.length) saveMainCache(allTools);
  } catch(err){
    // 네트워크 오류가 나도 현재 관리자 화면의 목록은 지우지 않는다.
  }
  renderList();
}

function renderList(){
  const list = document.getElementById("list");
  const items = allTools.filter(t => t.village === currentVillage);
  document.getElementById("count").textContent = `현재 ${items.length} / ${VILLAGE_LIMIT}명`;
  document.getElementById("addBtn").disabled = !editingToolId && items.length >= VILLAGE_LIMIT;

  list.innerHTML = "";
  if (items.length === 0){
    list.innerHTML = '<div style="opacity:.6; font-size:0.82rem;">아직 아무도 없어요.</div>';
    return;
  }
  items.forEach(t => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div class="info">
        <span class="n">${escapeHTML(t.emoji || "🔥")} ${escapeHTML(t.name)}</span>
        <span class="u">${escapeHTML(t.url || "(링크 없음)")}</span>
      </div>
      <div class="actions">
        <button class="edit" type="button">수정</button>
        <button class="del" type="button">삭제</button>
      </div>
    `;
    row.querySelector(".edit").onclick = () => startEdit(t);
    row.querySelector(".del").onclick = () => deleteTool(t.id, t.name);
    list.appendChild(row);
  });
}

function setMode(mode){
  const radio = document.querySelector(`input[name="mode"][value="${mode}"]`);
  if (radio) radio.checked = true;
  const isFile = mode === "file";
  document.getElementById("urlField").style.display = isFile ? "none" : "block";
  document.getElementById("fileField").style.display = isFile ? "block" : "none";
}

function resetForm(){
  editingToolId = null;
  document.getElementById("formTitle").textContent = "새 캐릭터 추가";
  document.getElementById("addBtn").textContent = "추가하기";
  document.getElementById("cancelEditBtn").style.display = "none";
  document.getElementById("fileLabel").textContent = "HTML 파일 선택";
  document.getElementById("fileHelp").textContent = "";
  document.getElementById("fName").value = "";
  document.getElementById("fEmoji").value = "";
  document.getElementById("fDesc").value = "";
  document.getElementById("fUrl").value = "";
  document.getElementById("fFile").value = "";
  document.getElementById("formMsg").textContent = "";
  document.getElementById("formMsg").className = "";
  setMode("url");
  renderList();
}

function startEdit(tool){
  editingToolId = String(tool.id || "");
  currentVillage = String(tool.village || currentVillage);
  buildTabs();
  document.getElementById("formTitle").textContent = `캐릭터 수정 · ${tool.name || ""}`;
  document.getElementById("addBtn").textContent = "수정 저장하기";
  document.getElementById("cancelEditBtn").style.display = "block";
  document.getElementById("fName").value = tool.name || "";
  document.getElementById("fEmoji").value = tool.emoji || "";
  document.getElementById("fDesc").value = tool.desc || "";
  document.getElementById("fFile").value = "";

  if (tool.fileId) {
    setMode("file");
    document.getElementById("fUrl").value = "";
    document.getElementById("fileLabel").textContent = "HTML 파일 교체 (선택사항)";
    document.getElementById("fileHelp").textContent = "파일을 선택하지 않으면 현재 업로드된 HTML은 그대로 유지됩니다.";
  } else {
    setMode("url");
    document.getElementById("fUrl").value = tool.url || "";
    document.getElementById("fileLabel").textContent = "HTML 파일 선택";
    document.getElementById("fileHelp").textContent = "";
  }
  document.getElementById("formMsg").textContent = "수정할 내용을 바꾼 뒤 저장하세요.";
  document.getElementById("formMsg").className = "";
  document.getElementById("toolFormCard")?.scrollIntoView({ behavior:"smooth", block:"start" });
  renderList();
}

document.getElementById("cancelEditBtn").addEventListener("click", resetForm);

async function deleteTool(id, name){
  if (!confirm(`"${name}" 을(를) 삭제할까요?`)) return;
  try {
    const data = await fetchJSON(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: "deleteTool", pin: verifiedPin, id, clientId })
    }, 1);
    if (data.ok) {
      if (Array.isArray(data.tools)) {
        allTools = data.tools;
        saveMainCache(allTools);
      } else {
        allTools = allTools.filter(t => String(t.id) !== String(id));
        saveMainCache(allTools);
      }
      if (editingToolId === id) resetForm();
      renderList();
    } else {
      alert(data.error || "삭제 실패");
    }
  } catch(err){
    alert("네트워크 오류, 다시 시도해주세요.");
  }
}

/* 등록 방식 토글 */
document.querySelectorAll('input[name="mode"]').forEach(r => {
  r.addEventListener("change", () => {
    const mode = document.querySelector('input[name="mode"]:checked').value;
    setMode(mode);
    const tool = editingToolId ? allTools.find(t => String(t.id) === editingToolId) : null;
    if (mode === "file" && tool && tool.fileId) {
      document.getElementById("fileLabel").textContent = "HTML 파일 교체 (선택사항)";
      document.getElementById("fileHelp").textContent = "파일을 선택하지 않으면 현재 업로드된 HTML은 그대로 유지됩니다.";
    } else {
      document.getElementById("fileLabel").textContent = "HTML 파일 선택";
      document.getElementById("fileHelp").textContent = "";
    }
  });
});

document.getElementById("addBtn").addEventListener("click", async () => {
  const name = document.getElementById("fName").value.trim();
  const emoji = document.getElementById("fEmoji").value.trim() || "🔥";
  const desc = document.getElementById("fDesc").value.trim();
  const mode = document.querySelector('input[name="mode"]:checked').value;
  const msg = document.getElementById("formMsg");
  msg.textContent = ""; msg.className = "";

  if (!name){ msg.textContent = "이름을 입력해주세요."; msg.className = "err"; return; }

  const isEdit = !!editingToolId;
  const payload = {
    action: isEdit ? "updateTool" : "addTool",
    pin: verifiedPin, clientId, village: currentVillage, name, emoji, desc, mode
  };
  if (isEdit) payload.id = editingToolId;

  if (mode === "url") {
    const url = document.getElementById("fUrl").value.trim();
    if (!url){ msg.textContent = "링크를 입력해주세요."; msg.className = "err"; return; }
    if (!isValidHttpUrl(url)){ msg.textContent = "주소는 http:// 또는 https:// 형식만 사용할 수 있습니다."; msg.className = "err"; return; }
    payload.url = url;
    await submitTool(payload, msg);
  } else {
    const file = document.getElementById("fFile").files[0];
    const existing = isEdit ? allTools.find(t => String(t.id) === editingToolId) : null;
    if (!file) {
      if (!isEdit || !existing || !existing.fileId) {
        msg.textContent = "HTML 파일을 선택해주세요."; msg.className = "err"; return;
      }
      await submitTool(payload, msg);
      return;
    }
    const reader = new FileReader();
    reader.onload = async () => {
      payload.fileContent = reader.result;
      await submitTool(payload, msg);
    };
    reader.readAsText(file, "utf-8");
  }
});

async function submitTool(payload, msg){
  document.getElementById("addBtn").disabled = true;
  try {
    const data = await fetchJSON(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) }, 1);
    if (data.ok) {
      const wasEdit = payload.action === "updateTool";
      if (Array.isArray(data.tools)) {
        allTools = data.tools;
        saveMainCache(allTools);
      }
      msg.textContent = wasEdit ? "수정됐어요! 메인 화면에도 즉시 반영됩니다." : "추가됐어요! 메인 화면에도 즉시 반영됩니다.";
      msg.className = "ok";
      editingToolId = null;
      document.getElementById("formTitle").textContent = "새 캐릭터 추가";
      document.getElementById("addBtn").textContent = "추가하기";
      document.getElementById("cancelEditBtn").style.display = "none";
      document.getElementById("fileLabel").textContent = "HTML 파일 선택";
      document.getElementById("fileHelp").textContent = "";
      document.getElementById("fName").value = "";
      document.getElementById("fEmoji").value = "";
      document.getElementById("fDesc").value = "";
      document.getElementById("fUrl").value = "";
      document.getElementById("fFile").value = "";
      setMode("url");
      if (!Array.isArray(data.tools)) {
        await loadTools();
      } else {
        renderList();
      }
    } else {
      msg.textContent = data.error || "추가 실패";
      msg.className = "err";
    }
  } catch(err){
    msg.textContent = "네트워크 오류, 다시 시도해주세요.";
    msg.className = "err";
  }
  renderList();
}

document.getElementById("pinBtn").addEventListener("click", async () => {
  const newPin = document.getElementById("pinNew").value.trim();
  const confirmPin = document.getElementById("pinConfirm").value.trim();
  const msg = document.getElementById("pinMsg");
  msg.textContent = ""; msg.className = "";

  if (!/^[0-9]{4}$/.test(newPin)) {
    msg.textContent = "PIN은 숫자 4자리로 입력해주세요.";
    msg.className = "err";
    return;
  }
  if (newPin !== confirmPin) {
    msg.textContent = "두 PIN이 서로 달라요.";
    msg.className = "err";
    return;
  }

  try {
    const data = await fetchJSON(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: "changePin", pin: verifiedPin, newPin, clientId })
    }, 1);
    if (data.ok) {
      verifiedPin = newPin; // 이 세션에서는 계속 새 PIN으로 요청하도록 갱신
      msg.textContent = "PIN이 변경됐어요. 다음 접속부터 새 PIN을 입력해주세요.";
      msg.className = "ok";
      document.getElementById("pinNew").value = "";
      document.getElementById("pinConfirm").value = "";
    } else {
      msg.textContent = data.error || "변경 실패";
      msg.className = "err";
    }
  } catch(err){
    msg.textContent = "네트워크 오류, 다시 시도해주세요.";
    msg.className = "err";
  }
});
</script>
</body>
</html>
