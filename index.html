<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>원무팀 지옥도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --outline:#160606;
    --panel:#241412;
    --panel-text:#f3ddc4;
    --ember:#ff7a2e;
    --ember-dim:#c1541c;
    --ash:#160d0b;

    --wonmu:#8a2a1f;   --wonmu-glow:#ff5a2e;
    --billing:#5a6b78; --billing-glow:#c9d9e2;
    --stats:#7a5a2f;   --stats-glow:#e0c07a;
    --finance:#b23a1f; --finance-glow:#ffb26b;
  }
  *{box-sizing:border-box; image-rendering:pixelated;}
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:'Noto Sans KR', sans-serif;
    color:var(--panel-text);
    background:
      radial-gradient(ellipse 60% 40% at 20% 15%, rgba(255,90,20,.20) 0%, transparent 60%),
      radial-gradient(ellipse 50% 35% at 85% 10%, rgba(255,60,20,.16) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 0%, #4a1108 0%, #1c0805 55%, #070302 100%);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  /* floating embers */
  .ember-particle{
    position:fixed;
    bottom:-10px;
    width:3px; height:3px;
    background:var(--ember);
    border-radius:50%;
    box-shadow:0 0 6px 1px rgba(255,122,46,.9);
    opacity:0;
    pointer-events:none;
    animation:rise linear infinite;
    z-index:0;
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:.9; }
    90%{ opacity:.5; }
    100%{ transform:translateY(-100vh) translateX(var(--drift,20px)); opacity:0; }
  }

  /* bottom flame silhouette strip */
  #floorflames{
    position:fixed; left:0; right:0; bottom:0; height:70px;
    z-index:0; pointer-events:none; opacity:.5;
  }

  .scene{
    max-width:1080px;
    margin:0 auto;
    padding:36px 22px 70px;
    position:relative;
    z-index:2;
  }

  header{ text-align:center; margin-bottom:26px; position:relative; z-index:2; }
  header h1{
    font-family:'Noto Sans KR', sans-serif;
    font-weight:900;
    font-size:1.7rem;
    color:var(--ember);
    text-shadow:3px 3px 0 var(--outline), 0 0 18px rgba(255,122,46,.55);
    margin:0 0 14px;
    line-height:1.5;
  }
  header p{
    display:inline-block;
    background:var(--panel);
    border:3px solid var(--outline);
    box-shadow:4px 4px 0 var(--outline), 0 0 16px rgba(255,90,20,.25);
    padding:9px 16px;
    font-size:0.82rem;
    font-weight:700;
    line-height:1.6;
    max-width:480px;
  }
  #search{
    display:block;
    margin:18px auto 0;
    width:min(300px, 88%);
    padding:9px 14px;
    border:3px solid var(--outline);
    background:var(--ash);
    color:var(--panel-text);
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size:0.85rem;
    outline:none;
  }
  #search::placeholder{ color:#a68c7c; }

  #center-ornament{
    position:relative;
    text-align:center;
    font-size:2.4rem;
    margin:6px 0 20px;
    filter:drop-shadow(0 0 16px rgba(255,110,30,.7));
    z-index:2;
  }
  #center-ornament span{
    display:block;
    font-weight:900;
    font-size:0.72rem;
    color:#caa085;
    margin-top:6px;
  }
  #center-ornament.clickable{
    cursor:pointer;
    transition:transform .16s ease, filter .16s ease;
  }
  #center-ornament.clickable:hover, #center-ornament.clickable:focus-visible{
    transform:translateY(-2px) scale(1.025);
    filter:drop-shadow(0 0 22px rgba(255,140,50,.95));
    outline:none;
  }
  .ornament-badge{
    position:absolute;
    top:-2px;
    left:calc(50% + 48px);
    min-width:18px; height:18px;
    padding:0 4px;
    border:1px solid rgba(255,180,110,.45);
    border-radius:999px;
    background:rgba(22,6,5,.82);
    color:#e7b177;
    font-size:.58rem;
    line-height:16px;
    font-style:normal;
    opacity:.78;
    display:none;
  }
  #center-ornament.clickable .ornament-badge{ display:block; }

  main{
    position:relative;
    z-index:2;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:34px 30px;
  }
  @media (max-width:740px){ main{grid-template-columns:1fr;} }

  .village{
    position:relative;
    background:var(--panel);
    border:4px solid var(--outline);
    box-shadow:6px 6px 0 var(--outline);
  }
  .village-glow{
    position:absolute;
    inset:0;
    overflow:hidden;
    z-index:0;
    pointer-events:none;
  }
  .blob{
    position:absolute;
    width:220px; height:220px;
    border-radius:50%;
    filter:blur(42px);
    opacity:.3;
    animation:breathe 4.5s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ transform:scale(1); opacity:.24; }
    50%{ transform:scale(1.18); opacity:.4; }
  }
  .theme-icon{
    position:absolute;
    bottom:12px; right:16px;
    font-size:2.3rem;
    opacity:.5;
  }
  .theme-icon.flicker{ animation:flicker 1.3s ease-in-out infinite; }
  @keyframes flicker{
    0%,100%{ transform:scale(1) rotate(-3deg); opacity:.45; }
    50%{ transform:scale(1.15) rotate(4deg); opacity:.75; }
  }
  .theme-icon.sway{ animation:sway 2.1s ease-in-out infinite; transform-origin:top center; }
  @keyframes sway{
    0%,100%{ transform:rotate(-10deg); }
    50%{ transform:rotate(10deg); }
  }
  .theme-icon.spin{ animation:spin 4.5s linear infinite; }
  @keyframes spin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  .theme-icon.simmer{ animation:simmer 1.7s ease-in-out infinite; }
  @keyframes simmer{
    0%,100%{ transform:translateY(0) scale(1); opacity:.5; }
    50%{ transform:translateY(-7px) scale(1.08); opacity:.8; }
  }
  .village-content{ position:relative; z-index:1; }

  .sign{
    position:relative;
    margin:-24px auto 0;
    width:fit-content;
    border:4px solid var(--outline);
    box-shadow:3px 3px 0 var(--outline), 0 0 12px rgba(0,0,0,.5);
    padding:9px 20px;
    color:#fff8ef;
    font-weight:900;
    font-size:1.02rem;
    letter-spacing:-0.01em;
    line-height:1.5;
    text-align:center;
    text-shadow:2px 2px 0 rgba(0,0,0,.55);
    background-image:repeating-linear-gradient(90deg, rgba(0,0,0,.15) 0 6px, transparent 6px 12px);
  }
  .sign::after{
    content:"";
    position:absolute;
    left:50%; bottom:-14px;
    transform:translateX(-50%);
    width:6px; height:14px;
    background:var(--outline);
  }
  .village-sub{
    text-align:center;
    padding:10px 10px 0;
    font-size:0.74rem;
    color:#dcc3ac;
    font-weight:700;
  }
  .spikes{
    height:14px;
    margin-top:14px;
    background-image:repeating-linear-gradient(90deg, #4a1b12 0 4px, transparent 4px 16px);
    border-top:2px solid var(--outline);
    border-bottom:2px solid var(--outline);
  }

  .village.wonmu .sign, .village.wonmu .spikes{ background-color:var(--wonmu); }
  .village.billing .sign, .village.billing .spikes{ background-color:var(--billing); }
  .village.stats .sign, .village.stats .spikes{ background-color:var(--stats); }
  .village.finance .sign, .village.finance .spikes{ background-color:var(--finance); }

  .npc-grid{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:16px;
    padding:16px;
  }
  .npc-slot{
    position:relative;
    width:96px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .npc{
    position:relative;
    width:96px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    text-decoration:none;
    color:var(--panel-text);
    cursor:pointer;
  }
  .patch{
    position:relative;
    width:64px; height:64px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #3a2018 0 55%, #1a0d09 100%);
    border:3px solid var(--outline);
    box-shadow:0 0 10px rgba(255,110,30,.35) inset;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    margin-bottom:6px;
    transition:transform .15s ease;
  }
  .sprite-stack{
    position:relative;
    width:40px; height:45px;
    margin-bottom:2px;
    animation:bob 0.9s ease-in-out infinite;
    animation-delay:var(--d, 0s);
  }
  .sprite{
    position:absolute; top:0; left:0;
    display:grid;
    grid-template-columns:repeat(8, 5px);
    grid-template-rows:repeat(9, 5px);
  }
  .sprite div{ width:5px; height:5px; }
  .sprite.a{ animation:frameA 0.9s steps(1) infinite; animation-delay:var(--d, 0s); }
  .sprite.b{ animation:frameB 0.9s steps(1) infinite; animation-delay:var(--d, 0s); }
  @keyframes frameA{ 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
  @keyframes frameB{ 0%,49%{opacity:0;} 50%,100%{opacity:1;} }
  @keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-3px);} }
  .sprite-stack svg{ width:100%; height:100%; display:block; }

  .item-badge{
    position:absolute;
    top:-6px; right:-2px;
    font-size:0.78rem;
    background:var(--panel);
    border:2px solid var(--outline);
    border-radius:50%;
    width:20px; height:20px;
    display:flex; align-items:center; justify-content:center;
    z-index:2;
  }
  .npc .name{
    width:100%;
    min-height:2.8em;
    font-size:0.69rem;
    font-weight:700;
    line-height:1.4;
    letter-spacing:-0.015em;
    word-break:keep-all;
    overflow-wrap:anywhere;
    text-wrap:balance;
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:2;
    overflow:hidden;
  }
  .npc .status{
    font-weight:900;
    font-size:0.56rem; color:var(--ember-dim); margin-top:3px;
  }
  .npc.pending .patch{ filter:grayscale(0.7); opacity:0.55; box-shadow:none; }
  .npc.pending .sprite-stack{ animation:none; }
  .npc.pending .sprite.a,.npc.pending .sprite.b{ animation:none; }
  .npc.pending .sprite.b{ opacity:0; }

  .tip{
    position:absolute;
    bottom:calc(100% + 4px);
    left:50%;
    transform:translateX(-50%);
    width:190px;
    background:#0d0403;
    color:#f3ddc4;
    border:1px solid var(--ember-dim);
    font-size:0.7rem;
    line-height:1.5;
    padding:8px 10px;
    opacity:0;
    pointer-events:none;
    transition:opacity .12s ease;
    z-index:5;
    text-align:left;
  }
  .npc:hover .tip, .npc:focus-visible .tip{ opacity:1; }
  .npc:hover .patch, .npc:focus-visible .patch{ transform:translateY(-3px); }
  .npc-download{
    position:absolute;
    top:48px;
    right:5px;
    z-index:4;
    width:18px; height:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(224,192,122,.32);
    border-radius:50%;
    color:#c6a46b;
    background:rgba(13,4,3,.72);
    font-size:.58rem;
    font-weight:900;
    line-height:1;
    text-decoration:none;
    opacity:.45;
    transition:opacity .15s ease, transform .15s ease, border-color .15s ease;
  }
  .npc-slot:hover .npc-download, .npc-download:focus-visible{
    opacity:.95;
    color:#fff2d2;
    border-color:#e0c07a;
    transform:translateY(-1px);
    outline:none;
  }

  #data-status{
    display:none;
    width:min(620px, 94%);
    margin:0 auto 24px;
    padding:8px 12px;
    border:1px solid rgba(255,122,46,.45);
    background:rgba(22,13,11,.82);
    color:#d8b9a2;
    font-size:0.72rem;
    line-height:1.5;
    text-align:center;
  }
  #data-status.warn{ display:block; color:#ffb08c; }

  .guestbook{
    position:relative;
    z-index:2;
    width:min(760px, 100%);
    margin:34px auto 6px;
    border:3px solid var(--outline);
    background:rgba(36,20,18,.92);
    box-shadow:5px 5px 0 var(--outline);
  }
  .guestbook-toggle{
    width:100%;
    border:0;
    background:transparent;
    color:var(--panel-text);
    font-family:inherit;
    padding:15px 17px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    cursor:pointer;
    text-align:left;
  }
  .guestbook-toggle strong{ color:#ffd0ad; font-size:.9rem; }
  .guestbook-toggle small{ display:block; margin-top:3px; color:#bda18d; font-size:.66rem; font-weight:700; }
  .guestbook-toggle .arrow{ color:var(--ember); font-weight:900; transition:transform .18s ease; }
  .guestbook.open .guestbook-toggle .arrow{ transform:rotate(180deg); }
  .guestbook-panel{ border-top:1px solid rgba(255,255,255,.08); padding:16px; }
  .guestbook-form{
    display:grid;
    grid-template-columns:140px 150px 1fr auto;
    gap:8px;
    align-items:start;
    margin-bottom:16px;
  }
  .guestbook-form input, .guestbook-form textarea{
    width:100%;
    border:2px solid #5e2b1c;
    background:#130907;
    color:var(--panel-text);
    border-radius:7px;
    padding:9px 10px;
    font-family:inherit;
    font-size:.77rem;
    outline:none;
  }
  .guestbook-form input:focus, .guestbook-form textarea:focus{ border-color:var(--ember-dim); }
  .guestbook-form textarea{ min-height:68px; resize:vertical; line-height:1.45; }
  .guestbook-submit{
    min-height:42px;
    padding:9px 13px;
    border:0;
    border-radius:7px;
    background:var(--ember);
    color:#1c0805;
    font-family:inherit;
    font-size:.76rem;
    font-weight:900;
    cursor:pointer;
  }
  .guestbook-submit:disabled{ opacity:.5; cursor:default; }
  .guestbook-form-meta{ grid-column:1/5; display:flex; justify-content:space-between; gap:8px; color:#9d8272; font-size:.63rem; margin-top:-3px; }
  #guestbook-msg{ min-height:1.3em; margin:0 0 10px; font-size:.7rem; color:#dcb59b; }
  #guestbook-msg.err{ color:#ff9679; }
  #guestbook-msg.ok{ color:#9bd394; }
  .guestbook-list{ display:flex; flex-direction:column; gap:8px; }
  .guestbook-empty{ text-align:center; padding:18px 8px; color:#a78b79; font-size:.73rem; }
  .guestbook-entry{
    border:1px solid rgba(255,255,255,.08);
    background:rgba(12,5,4,.35);
    padding:9px 11px;
    border-radius:7px;
  }
  .guestbook-head{ display:flex; justify-content:space-between; gap:10px; margin-bottom:4px; align-items:center; }
  .guestbook-head-right{ display:flex; align-items:center; gap:7px; }
  .guestbook-delete-btn{
    border:1px solid rgba(255,122,46,.38); background:transparent; color:#c49a80;
    border-radius:5px; padding:3px 7px; font-family:inherit; font-size:.6rem; cursor:pointer;
  }
  .guestbook-delete-btn:hover{ color:#ffd0ad; border-color:var(--ember-dim); }
  .guestbook-delete-panel{
    display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:8px; padding-top:8px;
    border-top:1px dashed rgba(255,255,255,.1);
  }
  .guestbook-delete-panel input{
    width:126px; border:1px solid #5e2b1c; background:#130907; color:var(--panel-text);
    border-radius:6px; padding:7px 8px; font-family:inherit; font-size:.7rem; letter-spacing:.18em;
  }
  .guestbook-delete-confirm, .guestbook-delete-cancel{
    border:0; border-radius:6px; padding:7px 9px; font-family:inherit; font-size:.66rem; font-weight:800; cursor:pointer;
  }
  .guestbook-delete-confirm{ background:#7a2d1b; color:#fff; }
  .guestbook-delete-cancel{ background:#3b2b27; color:#d9c1b1; }
  .guestbook-delete-note{ width:100%; color:#9d8272; font-size:.6rem; }
  .guestbook-name{ color:#f0c3a4; font-size:.72rem; font-weight:900; }
  .guestbook-time{ color:#8f7565; font-size:.61rem; white-space:nowrap; }
  .guestbook-text{ color:#e3cfbf; font-size:.72rem; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere; }
  .guestbook-owner-reply{
    margin:9px 0 0 18px; padding:8px 10px; border-left:3px solid rgba(255,122,46,.55);
    border-radius:0 6px 6px 0; background:rgba(255,122,46,.07);
  }
  .guestbook-owner-head{ display:flex; justify-content:space-between; gap:8px; align-items:center; margin-bottom:3px; }
  .guestbook-owner-name{ color:#ffad79; font-size:.66rem; font-weight:900; }
  .guestbook-owner-time{ color:#80685b; font-size:.58rem; white-space:nowrap; }
  .guestbook-owner-text{ color:#d9c7ba; font-size:.69rem; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere; }
  @media (max-width:650px){
    .guestbook-form{ grid-template-columns:1fr auto; }
    .guestbook-form input{ grid-column:1/3; }
    .guestbook-form textarea{ grid-column:1/2; }
    .guestbook-form-meta{ grid-column:1/3; }
  }

  footer{
    text-align:center;
    color:#c9a98f;
    font-size:0.76rem;
    padding:26px 20px 0;
    line-height:1.7;
    position:relative; z-index:2;
  }
  footer code{
    background:var(--ash); color:var(--panel-text);
    border:1px solid var(--ember-dim); padding:1px 6px;
  }
  footer a{ color:#d6b49a; text-decoration:none; }
  footer a:hover{ color:#ffb07a; text-decoration:underline; }
  .footer-meta{ margin-top:18px; font-size:0.7rem; line-height:1.8; }
  .footer-copy{ margin-top:6px; opacity:.62; font-size:0.64rem; line-height:1.7; }
</style>
</head>
<body>

<svg id="floorflames" viewBox="0 0 300 70" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M0,70 C10,40 20,15 30,45 C40,70 50,30 60,10 C70,-5 80,25 90,50 C100,70 110,40 120,20 C130,0 140,30 150,55 C160,70 170,45 180,25 C190,5 200,35 210,55 C220,70 230,50 240,30 C250,10 260,40 270,60 C280,70 290,55 300,60 L300,70 Z" fill="#5a1508"/>
</svg>

<div class="scene">
  <header>
    <h1>원무팀 지옥도</h1>
    <p>캐릭터를 클릭하면 그 도구로 이동합니다.</p>
    <input id="search" type="text" placeholder="도구 이름으로 찾기...">
  </header>

  <div id="center-ornament" aria-label="상단 악마 바로가기">🔥👹🔥<i id="ornament-badge" class="ornament-badge" aria-hidden="true"></i><span>염라대왕도 두 손을 들었습니다.</span></div>

  <div id="data-status" role="status" aria-live="polite"></div>
  <main id="map"></main>

  <section id="guestbook" class="guestbook" aria-label="저승 방명록">
    <button id="guestbook-toggle" class="guestbook-toggle" type="button" aria-expanded="false" aria-controls="guestbook-panel">
      <span><strong>👹 저승 방명록</strong><small>살아있는 자는 흔적을 남기고 가시오.</small></span>
      <span class="arrow" aria-hidden="true">⌄</span>
    </button>
    <div id="guestbook-panel" class="guestbook-panel" hidden>
      <form id="guestbook-form" class="guestbook-form">
        <input id="guestbook-name" type="text" maxlength="15" placeholder="닉네임 (15자 이내)" autocomplete="nickname" required>
        <input id="guestbook-delete-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="삭제 PIN 4자리" autocomplete="new-password" required>
        <textarea id="guestbook-message" maxlength="150" placeholder="한마디 남겨주세요. (150자 이내)" required></textarea>
        <button id="guestbook-submit" class="guestbook-submit" type="submit">흔적 남기기</button>
        <div class="guestbook-form-meta"><span>삭제 PIN 4자리는 본인 글 삭제에 필요합니다 · 연속 등록 30초</span><span id="guestbook-count">0 / 150</span></div>
      </form>
      <div id="guestbook-msg" role="status" aria-live="polite"></div>
      <div id="guestbook-list" class="guestbook-list"><div class="guestbook-empty">방명록을 불러오는 중입니다…</div></div>
    </div>
  </section>

  <footer>
    회색 망자는 아직 링크가 없는 도구예요.<br>
    관리자 페이지에서 링크 또는 HTML 파일을 등록하면 바로 사용할 수 있습니다.
    <div class="footer-meta">

<script>
/* ============================================================
   CONFIG — 여기만 수정하면 지도가 바뀝니다.
   url이 빈 문자열("")이면 회색 망자(준비중)로 표시됩니다.
   ============================================================ */
/* ============================================================
   배포 후 이 값을 Apps Script 웹 앱 URL로 바꿔주세요 (Code.gs 참고)
   ============================================================ */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwCtH6IPuuBwaYtDCvzby4fCdUwN4xwhcg282JTL3U6tvauvBJmEg0boxmlHyQ-rd3yGA/exec";
const LOCAL_CACHE_KEY = "gotohell-site-v3";
const LOCAL_CACHE_MAX_AGE = 7 * 24 * 60 * 60 * 1000; // 7일: 오래돼도 먼저 표시 후 즉시 갱신
const FETCH_TIMEOUT_MS = 20000; // Apps Script 콜드스타트 대비. 화면은 로컬 캐시로 즉시 표시됨
const GUESTBOOK_CLIENT_KEY = "gotohell-guestbook-client-id";
const GUESTBOOK_NAME_KEY = "gotohell-guestbook-name";
const guestbookClientId = (() => {
  try {
    let id = localStorage.getItem(GUESTBOOK_CLIENT_KEY);
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`);
      localStorage.setItem(GUESTBOOK_CLIENT_KEY, id);
    }
    return id;
  } catch (_) { return "guest"; }
})();

/* 마을(섹터) 메타 정보 — 마을 자체를 추가/변경할 때만 여기를 수정하면 됩니다.
   각 마을 안의 도구 "명단"은 이제 관리자 페이지에서 추가/삭제하며,
   Google Sheets에서 실시간으로 불러옵니다. */
const VILLAGE_META = [
  { id: "wonmu", name: "발설지옥 · 원무 마을", sub: "말이 너무 많아 혀가 닳는 지옥", cloth: "#8a2a1f", hair: "#ff7a2e", bg: "flame" },
  { id: "billing", name: "도산지옥 · 비급여·청구 마을", sub: "규정의 칼날 위를 걷는 지옥", cloth: "#5a6b78", hair: "#c9d3d8", bg: "blades" },
  { id: "stats", name: "거해지옥 · 통계·분석 마을", sub: "매달 반복되는 집계에 톱질당하는 지옥", cloth: "#7a5a2f", hair: "#e0c07a", bg: "saw" },
  { id: "finance", name: "화탕지옥 · 개인 자산 마을", sub: "널뛰는 시장에 속이 끓는 지옥", cloth: "#b23a1f", hair: "#ffb26b", bg: "cauldron" }
];

/* 백엔드 연결 전이거나 fetch 실패 시 보여줄 기본 명단(폴백) */
const FALLBACK_TOOLS = [
  { village: "wonmu", name: "입원 업무 현황", emoji: "🏥", url: "https://real4goon.github.io/admission/", desc: "KIOSK 업로드 기반 입원 워크로드 EMR" },
  { village: "wonmu", name: "VIP 관리", emoji: "👑", url: "https://real4goon.github.io/hl-vip/", desc: "VIP 등급·일정·공지 통합 관리" },
  { village: "wonmu", name: "원무 지식창고", emoji: "🔍", url: "https://real4goon.github.io/wonmu-search/", desc: "원무팀 업무 지식 검색" }
];

const CONFIG = VILLAGE_META.map(v => ({ ...v, tools: [] }));
let SITE_ORNAMENT = { mode:"none", url:"", actionUrl:"", hasFile:false, fileName:"" };

/* ---------- 조선시대 신분별 8비트 픽셀 캐릭터 4종 (특정 인물/작품 모작 아님) ----------
   사또(sado) / 왕(king) / 신하(sinha) / 무당(mudang) — 마을 안에서 번갈아 등장
   O=외곽선 S=피부 W=흰옷깃 H=모자/머리띠 C=옷 R=붉은장식 B=파란장식 .=투명 */
const ARCHETYPE_DATA = {
  sado: {
    top: ["..HHHH..", ".HHHHHH.", "HHHHHHHH", ".OSSSSO.", ".OSOOSO.", "..OWWO..", "OCCCCCCO"],
    H: "#1c1c1c", C: "#2c3e63"
  },
  king: {
    top: ["..HHHH..", ".HHHHHH.", "HHHHHHHH", ".OSSSSO.", ".OSOOSO.", "..OWWO..", "OCCCCCCO"],
    H: "#151515", C: "#c23b32"
  },
  sinha: {
    top: ["..HHHH..", ".HHHHHH.", "HHHHHHHH", ".OSSSSO.", ".OSOOSO.", "..OWWO..", "OCCCCCCO"],
    H: "#1c1c1c", C: "#3c6e5a"
  },
  mudang: {
    top: ["..HHHH..", ".HHHHHH.", "HHHHHHHB", ".OSSSSO.", ".OSOOSO.", "..OSSO..", "RCCCCCCB"],
    H: "#c9302c", C: "#d1a92c"
  }
};
const LEG_A = [".OC..CO.", ".OO..OO."];
const LEG_B = [".O.CC.O.", "OO....OO"];
const ARCHETYPES = ["sado", "king", "sinha", "mudang"];

function spriteHTML(rows, colorMap){
  return rows.map(row =>
    [...row].map(ch => `<div style="background:${colorMap[ch] || 'transparent'}"></div>`).join("")
  ).join("");
}
function buildFrames(archetype){
  const a = ARCHETYPE_DATA[archetype];
  const colorMap = { O:"#150505", S:"#c9b39f", W:"#f1e2c4", H:a.H, C:a.C, R:"#a52a2a", B:"#1e3f8f" };
  return {
    a: spriteHTML([...a.top, ...LEG_A], colorMap),
    b: spriteHTML([...a.top, ...LEG_B], colorMap)
  };
}

/* ---------- 마을별 배경 연출: 은은한 글로우 + 테마 아이콘(움직임 포함) ---------- */
const DECOR = {
  flame:    { icon: "🔥", motion: "flicker" },
  blades:   { icon: "🗡️", motion: "sway" },
  saw:      { icon: "🪚", motion: "spin" },
  cauldron: { icon: "♨️", motion: "simmer" }
};

const map = document.getElementById("map");

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[ch]));
}

function applyOrnament(value) {
  const raw = value && typeof value === "object" ? value : {};
  const mode = ["url", "file"].includes(String(raw.mode || "")) ? String(raw.mode) : "none";
  SITE_ORNAMENT = {
    mode,
    url: normalizeHttpUrl(raw.url),
    actionUrl: normalizeHttpUrl(raw.actionUrl),
    hasFile: !!raw.hasFile,
    fileName: cleanText(raw.fileName, 120)
  };
  renderOrnamentAction();
}

function renderOrnamentAction(){
  const el = document.getElementById("center-ornament");
  const badge = document.getElementById("ornament-badge");
  if (!el || !badge) return;
  const href = SITE_ORNAMENT.mode === "url" ? SITE_ORNAMENT.url : SITE_ORNAMENT.actionUrl;
  const active = !!href;
  el.classList.toggle("clickable", active);
  el.tabIndex = active ? 0 : -1;
  el.setAttribute("role", active ? "link" : "img");
  if (active) {
    const isFile = SITE_ORNAMENT.mode === "file";
    badge.textContent = isFile ? "↓" : "↗";
    el.title = isFile
      ? `${SITE_ORNAMENT.fileName || "첨부파일"} 다운로드`
      : "연결된 페이지 열기";
  } else {
    badge.textContent = "";
    el.removeAttribute("title");
  }
}

function openOrnamentAction(){
  const href = SITE_ORNAMENT.mode === "url" ? SITE_ORNAMENT.url : SITE_ORNAMENT.actionUrl;
  if (!href) return;
  window.open(href, "_blank", "noopener");
}

document.getElementById("center-ornament").addEventListener("click", openOrnamentAction);
document.getElementById("center-ornament").addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openOrnamentAction(); }
});

function render(filter = "") {
  map.innerHTML = "";
  const q = filter.trim().toLowerCase();

  CONFIG.forEach(village => {
    const filteredTools = village.tools.filter(t =>
      !q || t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q)
    );
    if (q && filteredTools.length === 0) return;

    const glowVar = getComputedStyle(document.documentElement).getPropertyValue(`--${village.id}-glow`).trim() || "#ffffff";

    const section = document.createElement("section");
    section.className = `village ${village.id}`;
    const decor = DECOR[village.bg] || { icon: "🔥", motion: "flicker" };
    section.innerHTML = `
      <div class="village-glow">
        <div class="blob" style="background:${glowVar}; left:-70px; top:-70px;"></div>
        <div class="blob" style="background:${glowVar}; right:-80px; bottom:-60px; animation-delay:1.4s;"></div>
        <span class="theme-icon ${decor.motion}">${decor.icon}</span>
      </div>
      <div class="village-content">
        <div class="sign">${village.name}</div>
        <div class="village-sub">${village.sub}</div>
        <div class="spikes"></div>
        <div class="npc-grid"></div>
      </div>
    `;
    const grid = section.querySelector(".npc-grid");

    filteredTools.forEach((tool, i) => {
      const hasUrl = !!tool.url;
      const hasFile = !!tool.hasFile;
      const archetype = ARCHETYPES[i % ARCHETYPES.length];
      const slot = document.createElement("div");
      slot.className = "npc-slot";

      const el = document.createElement(hasUrl ? "a" : "div");
      el.className = "npc" + (hasUrl ? "" : " pending");
      if (hasUrl) { el.href = tool.url; el.target = "_blank"; el.rel = "noopener"; }
      el.tabIndex = 0;
      const delay = (i * 0.13).toFixed(2) + "s";
      const frames = buildFrames(archetype);
      el.innerHTML = `
        <div class="patch">
          <div class="sprite-stack" style="--d:${delay}">
            <div class="sprite a" style="--d:${delay}">${frames.a}</div>
            <div class="sprite b" style="--d:${delay}">${frames.b}</div>
          </div>
          <span class="item-badge">${escapeHTML(tool.emoji)}</span>
        </div>
        <span class="name">${escapeHTML(tool.name)}</span>
        ${hasUrl ? "" : '<span class="status">준비중</span>'}
        <span class="tip">${escapeHTML(tool.desc)}${hasUrl ? "" : " · 링크 미등록"}</span>
      `;
      slot.appendChild(el);

      if (hasFile && tool.id) {
        const dl = document.createElement("a");
        dl.className = "npc-download";
        dl.href = SCRIPT_URL + "?download=" + encodeURIComponent(tool.id);
        dl.target = "_blank";
        dl.rel = "noopener";
        dl.textContent = "↓";
        dl.title = `${tool.name} 원본 HTML 다운로드`;
        slot.appendChild(dl);
      }
      grid.appendChild(slot);
    });

    map.appendChild(section);
  });
}

document.getElementById("search").addEventListener("input", e => render(e.target.value));

function normalizeHttpUrl(value) {
  const raw = String(value || "").trim();
  if (!raw) return "";
  try {
    const u = new URL(raw);
    return (u.protocol === "https:" || u.protocol === "http:") ? u.href : "";
  } catch (_) {
    return "";
  }
}

function cleanText(value, maxLen) {
  return String(value ?? "").replace(/[\u0000-\u001F\u007F]/g, " ").trim().slice(0, maxLen);
}

function applyTools(toolRows) {
  CONFIG.forEach(v => (v.tools = []));
  (Array.isArray(toolRows) ? toolRows : []).forEach(t => {
    const v = CONFIG.find(v => v.id === String(t.village || ""));
    if (!v) return;
    v.tools.push({
      id: cleanText(t.id, 80),
      name: cleanText(t.name, 80) || "이름 없는 도구",
      emoji: cleanText(t.emoji, 16) || "🔥",
      url: normalizeHttpUrl(t.url),
      desc: cleanText(t.desc, 240),
      hasFile: !!t.fileId
    });
  });
}

function setDataStatus(message = "", isWarn = false) {
  const el = document.getElementById("data-status");
  el.textContent = message;
  el.className = isWarn && message ? "warn" : "";
}

function readLocalTools() {
  try {
    const cached = JSON.parse(localStorage.getItem(LOCAL_CACHE_KEY) || "null");
    if (!cached || !Array.isArray(cached.tools) || !cached.savedAt) return null;
    return {
      tools: cached.tools,
      ornament: cached.ornament || { mode:"none" },
      age: Date.now() - Number(cached.savedAt)
    };
  } catch (_) {
    return null;
  }
}

function saveLocalTools(tools, ornament = SITE_ORNAMENT) {
  try {
    localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({ tools, ornament, savedAt: Date.now() }));
  } catch (_) {}
}

async function fetchJSON(url, retries = 0, timeoutMs = FETCH_TIMEOUT_MS){
  for (let attempt = 0; attempt <= retries; attempt++){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetch(url, { cache: "no-store", signal: controller.signal });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      return JSON.parse(text);
    } catch(err){
      if (attempt === retries) throw err;
      await new Promise(r => setTimeout(r, 350));
    } finally {
      clearTimeout(timer);
    }
  }
}

async function loadData() {
  const cached = readLocalTools();
  let hasUsableData = false;

  // 재방문은 마지막 정상 명단을 즉시 표시한다. Apps Script 응답은 뒤에서 갱신한다.
  if (cached && cached.tools.length) {
    applyTools(cached.tools);
    applyOrnament(cached.ornament);
    render();
    hasUsableData = true;
    if (cached.age > LOCAL_CACHE_MAX_AGE) {
      setDataStatus("최근 저장된 명단을 먼저 표시했습니다. 최신 명단을 확인 중입니다…", true);
    }
  } else {
    applyTools(FALLBACK_TOOLS);
    applyOrnament({ mode:"none" });
    render();
    setDataStatus("최신 명단을 불러오는 중입니다…", false);
  }

  try {
    const data = await fetchJSON(SCRIPT_URL + "?action=getData&_=" + Date.now(), 1);
    if (!data.ok || !Array.isArray(data.tools)) throw new Error(data.error || "잘못된 응답");
    applyTools(data.tools);
    applyOrnament(data.ornament || { mode:"none" });
    saveLocalTools(data.tools, SITE_ORNAMENT);
    render(document.getElementById("search").value);
    setDataStatus("");
  } catch (err) {
    if (hasUsableData) {
      setDataStatus("⚠ 최신 명단 확인에 실패해 마지막 정상 명단을 표시하고 있습니다.", true);
    } else {
      setDataStatus("⚠ 실시간 명단을 불러오지 못해 기본 명단을 표시하고 있습니다.", true);
    }
  }
}

let guestbookLoaded = false;
let guestbookLoading = false;

function formatGuestbookTime(value){
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return "";
  return new Intl.DateTimeFormat("ko-KR", {
    month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false
  }).format(d);
}

function renderGuestbook(entries){
  const list = document.getElementById("guestbook-list");
  list.innerHTML = "";
  if (!Array.isArray(entries) || !entries.length) {
    const empty = document.createElement("div");
    empty.className = "guestbook-empty";
    empty.textContent = "아직 남겨진 흔적이 없습니다. 첫 흔적을 남겨보세요.";
    list.appendChild(empty);
    return;
  }
  entries.forEach(item => {
    const box = document.createElement("article");
    box.className = "guestbook-entry";
    const head = document.createElement("div");
    head.className = "guestbook-head";
    const name = document.createElement("span");
    name.className = "guestbook-name";
    name.textContent = String(item.nickname || "익명").slice(0,15);
    const right = document.createElement("div");
    right.className = "guestbook-head-right";
    const time = document.createElement("span");
    time.className = "guestbook-time";
    time.textContent = formatGuestbookTime(item.createdAt);
    right.appendChild(time);
    if (item.canDelete) {
      const del = document.createElement("button");
      del.type = "button";
      del.className = "guestbook-delete-btn";
      del.textContent = "삭제";
      del.addEventListener("click", () => openGuestbookDeletePanel(box, item));
      right.appendChild(del);
    }
    const text = document.createElement("div");
    text.className = "guestbook-text";
    text.textContent = String(item.message || "").slice(0,150);
    head.append(name, right);
    box.append(head, text);
    if (item.reply) {
      const replyBox = document.createElement("div");
      replyBox.className = "guestbook-owner-reply";
      const replyHead = document.createElement("div");
      replyHead.className = "guestbook-owner-head";
      const replyName = document.createElement("span");
      replyName.className = "guestbook-owner-name";
      replyName.textContent = "👹 주인장";
      const replyTime = document.createElement("span");
      replyTime.className = "guestbook-owner-time";
      replyTime.textContent = formatGuestbookTime(item.replyAt);
      const replyText = document.createElement("div");
      replyText.className = "guestbook-owner-text";
      replyText.textContent = String(item.reply || "").slice(0,200);
      replyHead.append(replyName, replyTime);
      replyBox.append(replyHead, replyText);
      box.appendChild(replyBox);
    }
    list.appendChild(box);
  });
}

function openGuestbookDeletePanel(box, item){
  box.querySelector(".guestbook-delete-panel")?.remove();
  const panel = document.createElement("div");
  panel.className = "guestbook-delete-panel";
  const input = document.createElement("input");
  input.type = "password";
  input.inputMode = "numeric";
  input.pattern = "[0-9]*";
  input.maxLength = 4;
  input.placeholder = "삭제 PIN 4자리";
  input.autocomplete = "off";
  const confirmBtn = document.createElement("button");
  confirmBtn.type = "button";
  confirmBtn.className = "guestbook-delete-confirm";
  confirmBtn.textContent = "삭제하기";
  const cancelBtn = document.createElement("button");
  cancelBtn.type = "button";
  cancelBtn.className = "guestbook-delete-cancel";
  cancelBtn.textContent = "취소";
  const note = document.createElement("div");
  note.className = "guestbook-delete-note";
  note.textContent = "글 작성할 때 설정한 4자리 삭제 PIN을 입력하세요.";
  cancelBtn.onclick = () => panel.remove();
  confirmBtn.onclick = async () => {
    const deletePin = input.value.replace(/\D/g, "").slice(0, 4);
    if (!/^[0-9]{4}$/.test(deletePin)) {
      note.textContent = "삭제 PIN 4자리를 입력해주세요.";
      return;
    }
    confirmBtn.disabled = true;
    note.textContent = "삭제 확인 중…";
    try {
      const data = await postJSON({ action:"deleteGuestbookSelf", id:item.id, deletePin, clientId:guestbookClientId });
      if (!data.ok) throw new Error(data.error || "삭제 실패");
      renderGuestbook(data.entries || []);
      const msg = document.getElementById("guestbook-msg");
      msg.textContent = "흔적을 지웠습니다.";
      msg.className = "ok";
      guestbookLoaded = true;
    } catch(err) {
      note.textContent = err?.message || "삭제하지 못했습니다.";
      confirmBtn.disabled = false;
      input.focus();
      input.select();
    }
  };
  panel.append(input, confirmBtn, cancelBtn, note);
  box.appendChild(panel);
  input.focus();
}
async function loadGuestbook(force = false){
  if (guestbookLoading || (guestbookLoaded && !force)) return;
  guestbookLoading = true;
  const msg = document.getElementById("guestbook-msg");
  if (!guestbookLoaded) msg.textContent = "저승의 흔적을 불러오는 중…";
  try {
    const data = await fetchJSON(SCRIPT_URL + "?action=getGuestbook&_=" + Date.now(), 0, 15000);
    if (!data.ok || !Array.isArray(data.entries)) throw new Error(data.error || "방명록 응답 오류");
    renderGuestbook(data.entries);
    guestbookLoaded = true;
    msg.textContent = "";
    msg.className = "";
  } catch(err) {
    msg.textContent = "⚠ 방명록을 불러오지 못했습니다. 잠시 후 다시 열어주세요.";
    msg.className = "err";
  } finally {
    guestbookLoading = false;
  }
}

async function postJSON(payload){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 15000);
  try {
    const res = await fetch(SCRIPT_URL, {
      method:"POST",
      body:JSON.stringify(payload),
      cache:"no-store",
      signal:controller.signal
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return JSON.parse(await res.text());
  } finally {
    clearTimeout(timer);
  }
}

const guestbookEl = document.getElementById("guestbook");
const guestbookToggle = document.getElementById("guestbook-toggle");
const guestbookPanel = document.getElementById("guestbook-panel");
const guestbookName = document.getElementById("guestbook-name");
const guestbookMessage = document.getElementById("guestbook-message");
const guestbookDeletePin = document.getElementById("guestbook-delete-pin");
const guestbookCount = document.getElementById("guestbook-count");
try { guestbookName.value = localStorage.getItem(GUESTBOOK_NAME_KEY) || ""; } catch (_) {}

guestbookMessage.addEventListener("input", () => {
  guestbookCount.textContent = `${guestbookMessage.value.length} / 150`;
});

guestbookToggle.addEventListener("click", async () => {
  const opening = guestbookPanel.hidden;
  guestbookPanel.hidden = !opening;
  guestbookEl.classList.toggle("open", opening);
  guestbookToggle.setAttribute("aria-expanded", opening ? "true" : "false");
  if (opening) await loadGuestbook();
});

document.getElementById("guestbook-form").addEventListener("submit", async e => {
  e.preventDefault();
  const nickname = guestbookName.value.trim();
  const message = guestbookMessage.value.trim();
  const deletePin = guestbookDeletePin.value.replace(/\D/g, "").slice(0, 4);
  const msg = document.getElementById("guestbook-msg");
  const btn = document.getElementById("guestbook-submit");
  if (!nickname) { msg.textContent = "닉네임을 입력해주세요."; msg.className = "err"; return; }
  if (!message) { msg.textContent = "한마디를 남겨주세요."; msg.className = "err"; return; }
  btn.disabled = true;
  msg.textContent = "흔적을 새기는 중…";
  msg.className = "";
  try {
    const data = await postJSON({ action:"addGuestbook", nickname, message, deletePin, clientId:guestbookClientId });
    if (!data.ok) throw new Error(data.error || "등록 실패");
    try { localStorage.setItem(GUESTBOOK_NAME_KEY, nickname); } catch (_) {}
    guestbookMessage.value = "";
    guestbookDeletePin.value = "";
    guestbookCount.textContent = "0 / 150";
    renderGuestbook(data.entries || []);
    guestbookLoaded = true;
    msg.textContent = "흔적을 남겼습니다. 👹";
    msg.className = "ok";
  } catch(err) {
    msg.textContent = err?.message || "방명록 등록에 실패했습니다.";
    msg.className = "err";
  } finally {
    btn.disabled = false;
  }
});

loadData();

/* 떠오르는 불씨 파티클 */
const emberLayer = document.body;
for (let i = 0; i < 18; i++) {
  const e = document.createElement("span");
  e.className = "ember-particle";
  e.style.left = Math.random() * 100 + "vw";
  e.style.setProperty("--drift", (Math.random()*40-20).toFixed(0) + "px");
  e.style.animationDuration = (6 + Math.random()*6).toFixed(1) + "s";
  e.style.animationDelay = (Math.random()*8).toFixed(1) + "s";
  emberLayer.appendChild(e);
}
</script>
